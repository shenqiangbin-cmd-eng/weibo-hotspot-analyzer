          {name:"代拍预警圈", score:67, target:"影视园区管理方", features:["高风险时段热力图","异常聚集人群提醒","跨剧组黑名单协同","巡逻路线智能优化"]}
        ]
      },
      {
        hotword: "61岁男子手术后在飞机上身亡",
        hotwordnum: "268696",
        hottag: "新",
        score: 79,
        background: "医疗恢复期与航空出行风险叠加，悲剧事件触发公众对“术后能否飞”的信息焦虑。",
        significance: "暴露术后出行建议不清晰、航司医疗应急能力认知不足等系统性问题。",
        metrics: {吸引力:16, 传播性:15, 共鸣度:18, 创意性:15, 需求:4, 市场:4, 可行:3, 持续:4},
        ideas: [
          {name:"术后飞行卡", score:81, target:"术后恢复人群与家属", features:["病种飞行风险分级","医生确认清单","乘机窗口建议","应急药品携带提示"]},
          {name:"空中医疗链", score:79, target:"航空公司与机场急救团队", features:["航前健康申报对接","机组应急流程指引","落地医院绿色通道","事件复盘系统"]},
          {name:"家属同行宝", score:77, target:"慢病老年人家庭", features:["旅途生命体征记录","异常提醒给家属","出行方案智能评估","保险保障推荐"]}
        ]
      },
      {
        hotword: "华为PuraXMax",
        hotwordnum: "263448",
        hottag: "",
        score: 81,
        background: "新品命名和参数爆料阶段会集中引爆关注，核心是硬件创新与品牌势能叠加。",
        significance: "反映高端手机市场竞争进入体验深耕期，用户从“参数党”向“场景效率党”转移。",
        metrics: {吸引力:17, 传播性:16, 共鸣度:15, 创意性:17, 需求:4, 市场:4, 可行:4, 持续:4},
        ideas: [
          {name:"新机罗盘", score:83, target:"准备购机的数码用户", features:["机型能力雷达图","真实场景对比测试","预算段推荐","旧机保值预测"]},
          {name:"换机算账", score:82, target:"对价格敏感的升级用户", features:["以旧换新净成本测算","分期与一次性支付比较","配件复用建议","三年持有成本预测"]},
          {name:"影像试片间", score:80, target:"内容创作者和摄影爱好者", features:["同场景影像盲测","夜景与人像打分","后期空间评估","社媒发布适配建议"]},
          {name:"折叠适配器", score:78, target:"大屏办公与移动生产力用户", features:["多任务效率评估","常用应用适配检测","外设兼容性清单","办公流畅度体检"]}
        ]
      },
      {
        hotword: "Daeny和Knight十指紧扣",
        hotwordnum: "259957",
        hottag: "新",
        score: 65,
        background: "电竞圈人物互动细节被放大传播，容易形成二创和阵营讨论。",
        significance: "说明电竞内容已经高度娱乐化，赛事叙事和人物关系成为流量增长点。",
        metrics: {吸引力:14, 传播性:15, 共鸣度:14, 创意性:13, 需求:2, 市场:2, 可行:3, 持续:2},
        ideas: [
          {name:"赛事情绪图", score:67, target:"电竞观众、俱乐部运营", features:["比赛期情绪曲线","热点互动片段追踪","选手话题体感指数","舆情风险阈值提醒"]},
          {name:"CP热度仪", score:64, target:"文娱社区运营团队", features:["关系话题热度监测","二创传播路径分析","粉圈冲突预警","社区内容引导模板"]}
        ]
      }
    ];

    const gradeClass = (score) => score >= 80 ? 'excellent' : (score >= 60 ? 'good' : 'normal');
    const gradeText = (score) => score >= 80 ? '优秀' : (score >= 60 ? '良好' : '一般');

    const avgScore = (topics.reduce((sum, t) => sum + t.score, 0) / topics.length).toFixed(1);
    const excellentCount = topics.filter(t => t.score >= 80).length;
    const goodCount = topics.filter(t => t.score >= 60 && t.score < 80).length;
    const normalCount = topics.filter(t => t.score < 60).length;

    const summaryData = [
      {label: '分析话题数', value: topics.length, cls: ''},
      {label: '平均评分', value: avgScore, cls: ''},
      {label: '优秀（≥80）', value: excellentCount, cls: 'excellent-text'},
      {label: '良好（60-79）', value: goodCount, cls: 'good-text'}
    ];

    const summaryGrid = document.getElementById('summaryGrid');
    summaryGrid.innerHTML = summaryData.map(item => `
      <div class="summary-card">
        <div class="summary-label">${item.label}</div>
        <div class="summary-value ${item.cls}">${item.value}</div>
      </div>
    `).join('');

    const total = topics.length;
    const distribution = document.getElementById('distribution');
    distribution.innerHTML = `
      <div class="section-title" style="margin:0 0 10px;font-size:18px;">统计概览</div>
      <div class="dist-item">
        <div class="dist-head"><span>优秀（≥80）</span><span>${excellentCount} / ${total}</span></div>
        <div class="bar-track"><div class="bar-fill bar-excellent" data-width="${(excellentCount/total*100).toFixed(1)}%"></div></div>
      </div>
      <div class="dist-item">
        <div class="dist-head"><span>良好（60-79）</span><span>${goodCount} / ${total}</span></div>
        <div class="bar-track"><div class="bar-fill bar-good" data-width="${(goodCount/total*100).toFixed(1)}%"></div></div>
      </div>
      <div class="dist-item">
        <div class="dist-head"><span>一般（<60）</span><span>${normalCount} / ${total}</span></div>
        <div class="bar-track"><div class="bar-fill bar-normal" data-width="${(normalCount/total*100).toFixed(1)}%"></div></div>
      </div>
      <div style="margin-top:10px;font-size:13px;color:#64748b;">本轮平均分 <strong style="color:#0f172a;">${avgScore}</strong>，热点整体处于“高传播+中高可产品化”区间。</div>
    `;

    const topicsContainer = document.getElementById('topics');
    topicsContainer.innerHTML = topics.map((topic, idx) => {
      const gClass = gradeClass(topic.score);
      const tagHtml = topic.hottag ? `<span class="tag-new">${topic.hottag}</span>` : '';
      const ideasHtml = topic.ideas.map(idea => `
        <div class="idea-card">
          <div class="idea-head">
            <h4 class="idea-name">${idea.name}</h4>
            <span class="idea-score">${idea.score}分</span>
          </div>
          <div class="idea-target">目标用户：${idea.target}</div>
          <ul class="idea-list">
            ${idea.features.map(f => `<li>${f}</li>`).join('')}
          </ul>
        </div>
      `).join('');

      return `
        <article class="topic-card ${gClass}" style="animation-delay:${idx*0.05}s">
          <div class="topic-head">
            <div>
              <h3 class="topic-title">${topic.hotword}</h3>
              <div class="topic-meta">
                <span>热度：${topic.hotwordnum}</span>
                <span>评级：${gradeText(topic.score)}</span>
                ${tagHtml}
              </div>
            </div>
            <div class="score-badge">${topic.score}</div>
          </div>

          <div class="score-row">
            <div class="score-line"><span>综合评分进度</span><span>${topic.score}/100</span></div>
            <div class="score-track"><div class="score-fill" data-width="${topic.score}%"></div></div>
          </div>

          <div class="analysis-text">
            <p><strong>话题背景推测：</strong>${topic.background}</p>
            <p><strong>社会意义：</strong>${topic.significance}</p>
          </div>

          <div class="metric-grid">
            <div class="metric"><div class="k">吸引力</div><div class="v">${topic.metrics.吸引力}</div></div>
            <div class="metric"><div class="k">传播性</div><div class="v">${topic.metrics.传播性}</div></div>
            <div class="metric"><div class="k">共鸣度</div><div class="v">${topic.metrics.共鸣度}</div></div>
            <div class="metric"><div class="k">创意性</div><div class="v">${topic.metrics.创意性}</div></div>
            <div class="metric"><div class="k">真实需求</div><div class="v">${topic.metrics.需求}</div></div>
            <div class="metric"><div class="k">市场规模</div><div class="v">${topic.metrics.市场}</div></div>
            <div class="metric"><div class="k">可行性</div><div class="v">${topic.metrics.可行}</div></div>
            <div class="metric"><div class="k">持续性</div><div class="v">${topic.metrics.持续}</div></div>
          </div>

          <div class="ideas-title">产品创意（${topic.ideas.length}个）</div>
          <div class="ideas-grid">${ideasHtml}</div>
        </article>
      `;
    }).join('');

    requestAnimationFrame(() => {
      document.querySelectorAll('.bar-fill, .score-fill').forEach(el => {
        el.style.width = el.dataset.width;
      });
    });
  </script>
</body>
</html>
